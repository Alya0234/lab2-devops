apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab2-web-deployment
  labels:
    app: lab2-web
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: lab2-web
  template:
    metadata:
      labels:
        app: lab2-web
    spec:
      containers:
      - name: web-container
        image: lab2-web:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: app-config
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"